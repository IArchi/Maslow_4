name: Cleanup Temporary Releases

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Cleanup old temporary releases
      uses: actions/github-script@v7
      with:
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const now = new Date();
          const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          
          let deletedCount = 0;
          
          for (const release of releases.data) {
            if (release.tag_name.startsWith('build-') && 
                release.prerelease && 
                new Date(release.created_at) < sevenDaysAgo) {
              
              console.log(`Deleting old temporary release: ${release.tag_name} (created: ${release.created_at})`);
              
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                
                // Also delete the tag
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
                
                deletedCount++;
              } catch (error) {
                console.log(`Failed to delete release ${release.tag_name}: ${error.message}`);
              }
            }
          }
          
          console.log(`Cleanup complete. Deleted ${deletedCount} temporary releases.`);