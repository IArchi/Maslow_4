name: Compile WebUI on MaslowBot Review Request

on:
  pull_request:
    types: [review_requested]
  issue_comment:
    types: [created]

jobs:
  compile-webui:
    runs-on: ubuntu-latest
    
    # Run when MaslowBot is requested as reviewer OR when specific build commands are used in a comment on a PR
    # Handles both single reviewer (requested_reviewer) and multiple reviewers (requested_reviewers) scenarios
    # Also handles issue_comment trigger for Copilot-created PRs  
    if: |
      (github.event_name == 'pull_request' && (
        github.event.requested_reviewer.login == 'MaslowBot' ||
        contains(github.event.requested_reviewers.*.login, 'MaslowBot')
      )) ||
      (github.event_name == 'issue_comment' && 
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, 'please build') || contains(github.event.comment.body, '/build'))
      )
    
    steps:
    - name: Get PR details for issue comment
      if: github.event_name == 'issue_comment'
      id: pr
      run: |
        PR_NUMBER=${{ github.event.issue.number }}
        PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")
        echo "head_sha=$(echo "$PR_DATA" | jq -r .head.sha)" >> $GITHUB_OUTPUT
        
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # For issue_comment events, checkout the PR head commit instead of the default branch
        ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.head_sha || github.sha }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
          
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
          
    - name: Install npm dependencies
      run: npm install
        
    - name: Build WebUI
      run: gulp package --lang en
        
    - name: Upload WebUI as artifact
      uses: actions/upload-artifact@v4
      with:
        name: index.html.gz
        path: dist/index.html.gz
        retention-days: 30
        
    - name: Create temporary release for direct download
      id: create_release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Create release
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: `build-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`,
            name: `WebUI Build ${context.runId}`,
            body: `Temporary release for PR build.
This release will be automatically deleted after 7 days.

**Build Details:**
- Commit: ${context.sha}
- Run ID: ${context.runId}
- Triggered by: ${context.eventName}`,
            draft: false,
            prerelease: true
          });
          
          // Upload asset
          const assetData = fs.readFileSync('dist/index.html.gz');
          await github.rest.repos.uploadReleaseAsset({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.data.id,
            name: 'index.html.gz',
            data: assetData,
          });
          
          // Set outputs for later steps
          core.setOutput('release_url', release.data.html_url);
          core.setOutput('release_id', release.data.id);
          
          return release.data;
        
    - name: Comment on PR with WebUI info
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'dist/index.html.gz';
          const stats = fs.statSync(path);
          const fileSizeInBytes = stats.size;
          const fileSizeInKB = (fileSizeInBytes / 1024).toFixed(2);
          
          // Determine the PR number and commit SHA based on the event type
          let prNumber, commitSha;
          if (context.eventName === 'pull_request') {
            prNumber = context.issue.number;
            commitSha = context.payload.pull_request.head.sha;
          } else if (context.eventName === 'issue_comment') {
            prNumber = context.issue.number;
            // Get the PR details to get the latest commit SHA
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            commitSha = pr.head.sha;
          }
          
          const triggerText = context.eventName === 'pull_request' 
            ? '_This comment was automatically generated when @MaslowBot was requested as a reviewer._'
            : '_This comment was automatically generated in response to a build request comment._';
          
          const comment = `🤖 **WebUI Compilation Complete** 🤖
          
          ✅ Successfully compiled ESP3D WebUI for English language
          
          **Build Details:**
          - Commit: \`${commitSha}\`
          - Language: \`en\` (English)
          - WebUI size: ${fileSizeInKB} KB (compressed)
          - Build time: ~3 seconds
          
          **Download:**
          - **Direct download**: [index.html.gz](${{ steps.create_release.outputs.release_url }}) (click "Assets" section)
          - **Artifact download**: Available from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (will be zipped)
          
          ${triggerText}`;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });