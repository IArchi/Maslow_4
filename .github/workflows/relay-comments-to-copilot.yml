name: Relay Comments to Copilot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  relay-comment:
    runs-on: ubuntu-latest
    
    if: |
      (contains(github.event.comment.body, '@MaslowBot') || contains(github.event.comment.body, '@maslowbot')) &&
      github.event.comment.user.login != 'MaslowBot'
    
    steps:
      - name: Relay comment to copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_GITHUB_TOKEN }}
          script: |
            const originalComment = context.payload.comment;
            const originalAuthor = originalComment.user.login;
            const originalBody = originalComment.body;
            
            if (originalBody.includes('@copilot')) {
              console.log('Comment already mentions @copilot, skipping relay');
              return;
            }
            
            if (originalBody.trim().length < 10) {
              console.log('Comment too short, skipping relay');
              return;
            }
            
            const divider = '━'.repeat(80);
            const relayComment = '@copilot\n\nUser @' + originalAuthor + ' mentioned @MaslowBot with the following request:\n\n' + divider + '\n\n' + originalBody + '\n\n' + divider + '\n\n_This comment was automatically relayed by MaslowBot so that @copilot can respond to the request._';
            
            let issueNumber;
            if (context.eventName === 'issue_comment') {
              issueNumber = context.issue.number;
            } else if (context.eventName === 'pull_request_review_comment') {
              const prNumber = context.payload.pull_request.number;
              issueNumber = prNumber;
            }
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: relayComment
              });
              
              console.log('Successfully relayed comment from @' + originalAuthor + ' to @copilot on issue/PR #' + issueNumber);
            } catch (error) {
              console.error('Failed to relay comment:', error);
              core.setFailed('Failed to relay comment: ' + error.message);
            }