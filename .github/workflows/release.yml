name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to release (for example v1.21.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and target matrix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG_INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
            CHECKOUT_REF="refs/tags/$TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            CHECKOUT_REF="$GITHUB_REF"
          else
            TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
            CHECKOUT_REF="$GITHUB_REF"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semver tag is required. Got '$TAG'." >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          MATRIX="$(python3 - <<'PY'
import json
from pathlib import Path
manifest = json.loads(Path('release-manifest.json').read_text())
print(json.dumps([target['env'] for target in manifest['targets']]))
PY
)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Preparing release for $TAG using targets: $MATRIX"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Cache npm dependencies (embedded)
        uses: actions/cache@v4
        with:
          path: firmware/embedded/node_modules
          key: ${{ runner.os }}-npm-embedded-${{ hashFiles('firmware/embedded/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-embedded-

      - name: Cache npm dependencies (ESP3D-WEBUI)
        uses: actions/cache@v4
        with:
          path: ESP3D-WEBUI/node_modules
          key: ${{ runner.os }}-npm-esp3d-${{ hashFiles('ESP3D-WEBUI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-esp3d-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Install embedded UI dependencies
        working-directory: firmware/embedded
        run: npm install

      - name: Build embedded fallback UI
        working-directory: firmware/embedded
        run: python3 build.py

      - name: Install ESP3D-WEBUI dependencies
        working-directory: ESP3D-WEBUI
        run: npm install

      - name: Build ESP3D-WEBUI
        working-directory: ESP3D-WEBUI
        run: npm run build:en

      - name: Sync built web UI into firmware data
        run: cp ESP3D-WEBUI/dist/index.html.gz firmware/FluidNC/data/index.html.gz

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem image
        working-directory: firmware
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Stage release inputs
        shell: bash
        run: |
          set -euo pipefail
          ENV_NAME='${{ matrix.env }}'
          STAGE_DIR="release-staging"
          mkdir -p "$STAGE_DIR/targets/$ENV_NAME" "$STAGE_DIR/common" "$STAGE_DIR/webui" "$STAGE_DIR/config"
          cp "firmware/.pio/build/$ENV_NAME/bootloader.bin" "$STAGE_DIR/targets/$ENV_NAME/"
          cp "firmware/.pio/build/$ENV_NAME/firmware.bin" "$STAGE_DIR/targets/$ENV_NAME/"
          cp "firmware/.pio/build/$ENV_NAME/partitions.bin" "$STAGE_DIR/targets/$ENV_NAME/"
          cp "firmware/.pio/build/$ENV_NAME/littlefs.bin" "$STAGE_DIR/targets/$ENV_NAME/"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "$STAGE_DIR/common/"
          cp ESP3D-WEBUI/dist/index.html.gz "$STAGE_DIR/webui/index.html.gz"
          cp firmware/FluidNC/data/maslow.yaml "$STAGE_DIR/config/maslow.yaml"

      - name: Validate staged inputs listing
        shell: bash
        run: |
          set -euo pipefail
          find release-staging -type f | sort

      - name: Upload staged release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-input-${{ matrix.env }}
          path: release-staging/
          if-no-files-found: error

  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-input-*
          path: release-staging
          merge-multiple: true

      - name: Package release assets
        run: |
          python3 scripts/package_release.py \
            --manifest release-manifest.json \
            --source-dir release-staging \
            --dist-dir dist/release \
            --version '${{ needs.prepare.outputs.version }}' \
            --tag '${{ needs.prepare.outputs.tag }}'

      - name: List packaged assets
        run: |
          ls -lah dist/release
          echo
          cat dist/release/SHA256SUMS.txt

      - name: Generate release notes
        run: |
          python3 scripts/generate_release_notes.py \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --owner '${{ github.repository_owner }}' \
            --repo '${{ github.event.repository.name }}' \
            --assets-manifest dist/release/release-assets.json \
            --output dist/release-notes.md || true
          if [ ! -s dist/release-notes.md ]; then
            cat > dist/release-notes.md <<'NOTES'
# Release Notes

Automated release generated successfully, but custom note generation was incomplete.
Please review the attached assets and commit history for full details.
NOTES
          fi

      - name: Upload packaged release bundle
        uses: actions/upload-artifact@v4
        with:
          name: packaged-release-${{ needs.prepare.outputs.tag }}
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          TITLE="$TAG - Firmware Release"
          NOTES_FILE='dist/release-notes.md'

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            mapfile -t existing_assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            mapfile -t desired_assets < <(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)
            for asset in "${existing_assets[@]}"; do
              if ! printf '%s\n' "${desired_assets[@]}" | grep -Fxq "$asset"; then
                echo "Deleting stale asset $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
          else
            echo "Creating release $TAG"
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" dist/release/* --clobber
