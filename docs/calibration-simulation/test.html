<!DOCTYPE html>
<html>
<head>
    <title>Quick Simulation Test</title>
</head>
<body>
    <h1>Testing Calibration Simulation</h1>
    <div id="output"></div>
    
    <script src="machine-simulator.js"></script>
    <script src="computation-simulator.js"></script>
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '<br>';
        }
        
        // Test machine simulator
        try {
            const config = {
                frameWidth: 3000,
                frameHeight: 2000,
                gridSize: 3,
                measurementError: 0.5,
                calibration_grid_width_mm_X: 0,
                calibration_grid_height_mm_Y: 0,
                calibrationMaxSpacingMm: 260
            };
            
            const machine = new MachineSimulator(config);
            log('✓ Machine simulator created');
            
            const gridInfo = machine.generateCalibrationGrid();
            log(`✓ Grid generated: ${gridInfo.gridSize}x${gridInfo.gridSize} with ${gridInfo.pointCount} points`);
            
            const measurement = machine.takeMeasurement(0);
            log(`✓ Measurement taken: TL=${measurement.tl.toFixed(2)}mm`);
            
            // Test computation simulator
            const computation = new ComputationSimulator(machine.initialGuess);
            log('✓ Computation simulator created');
            
            log('<br><strong>All tests passed!</strong>');
        } catch (e) {
            log(`<span style="color:red">✗ Error: ${e.message}</span>`);
            console.error(e);
        }
    </script>
</body>
</html>
